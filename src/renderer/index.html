<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:;">
  <title>Docs2PDF</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      height: 100%;
      overflow: hidden;
    }
    #root {
      height: 100%;
    }
    .init-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0f172a;
      z-index: 99999;
    }
    .init-loader svg {
      animation: initPulse 1.5s ease-in-out infinite;
    }
    .init-loader-text {
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      animation: initBlink 1.5s ease-in-out infinite;
    }
    .init-loader-bar {
      width: 160px;
      height: 3px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    .init-loader-bar-inner {
      width: 40%;
      height: 100%;
      background: #6366f1;
      border-radius: 3px;
      animation: initBar 1.2s ease-in-out infinite;
    }
    @keyframes initPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    @keyframes initBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes initBar {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(250%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="init-loader">
      <svg width="64" height="64" viewBox="0 0 100 100" fill="none">
        <rect x="10" y="8" width="55" height="70" rx="6" fill="#6366f1" opacity="0.15"/>
        <rect x="35" y="22" width="55" height="70" rx="6" fill="#6366f1" opacity="0.35"/>
        <rect x="20" y="15" width="55" height="70" rx="6" fill="#6366f1"/>
        <path d="M35 35H60M35 47H55M35 59H48" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <circle cx="70" cy="65" r="18" fill="#22c55e"/>
        <path d="M62 65L68 71L78 59" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="init-loader-bar"><div class="init-loader-bar-inner"></div></div>
      <span class="init-loader-text">Loading...</span>
    </div>
  </div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
