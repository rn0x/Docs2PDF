app-id: com.docs2pdf.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: run.sh

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
  - --env=ELECTRON_TRASH=gio

build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    XDG_CACHE_HOME: /run/build/docs2pdf/flatpak-node/cache
    npm_config_cache: /run/build/docs2pdf/flatpak-node/npm-cache
    npm_config_nodedir: /usr/lib/sdk/node24

modules:
  - name: docs2pdf
    buildsystem: simple
    sources:
      - type: dir
        path: ..

      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper /app/main/docs2pdf "$@"

    build-commands:
      - npm install
      - npm run build
      - npx electron-builder --linux dir
      - cp -a release/linux-unpacked /app/main
      - install -Dm755 -t /app/bin/ ../run.sh
      - install -Dm644 public/icon.png /app/share/icons/hicolor/512x512/apps/com.docs2pdf.app.png
      - install -Dm644 flatpak/com.docs2pdf.app.desktop /app/share/applications/com.docs2pdf.app.desktop
      - install -Dm644 flatpak/com.docs2pdf.app.metainfo.xml /app/share/metainfo/com.docs2pdf.app.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/com.docs2pdf.app/LICENSE
